name: Question
description: Ask about usage or contributing without disclosing secrets.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Read the README first. Vulnerability details belong in private reporting.
  - type: textarea
    id: question
    attributes:
      label: Question and relevant context
      description: Say what you tried; exclude credentials and personal data.
    validations:
      required: true
