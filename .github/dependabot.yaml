version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies, maintenance]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    # Python minor releases change the interpreter, not just a patch. Keep the
    # selected .python-version line until a deliberate runtime migration PR.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    # A new PostgreSQL major needs a reviewed data upgrade/restore plan.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies, deployment]
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
