version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies, maintenance]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies, deployment]
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
