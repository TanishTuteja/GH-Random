name: Production deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published signed stable version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

# Never cancel a deployment because another dispatch arrives. The VM additionally
# holds host/database fences; canceling Actions does not stop an active migration.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  queue:
    name: Queue approved deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      # Reviewer/branch rules still apply. Only the VM records actual success.
      deployment: false
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.queue.outputs.deployment_id }}
      app_id: ${{ vars.PRODUCTION_DEPLOYMENT_APP_ID }}
      creator_id: ${{ vars.PRODUCTION_DEPLOYMENT_CREATOR_ID }}
    steps:
      - name: Check out the approved main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Queue a verified release, not a branch or mutable image tag
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRODUCTION_DEPLOYMENT_APP_ID: ${{ vars.PRODUCTION_DEPLOYMENT_APP_ID }}
          PRODUCTION_DEPLOYMENT_CREATOR_ID: ${{ vars.PRODUCTION_DEPLOYMENT_CREATOR_ID }}
        run: python deployment/pull.py queue --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/request.json"
      - name: Publish the immutable run-bound approval receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: approved-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
  observe:
    name: Observe actual VM deployment
    needs: queue
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Check out the approved observer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Wait for the VM App to report migration and HTTPS smoke success
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.queue.outputs.deployment_id }}
          PRODUCTION_DEPLOYMENT_APP_ID: ${{ needs.queue.outputs.app_id }}
          PRODUCTION_DEPLOYMENT_CREATOR_ID: ${{ needs.queue.outputs.creator_id }}
        run: python deployment/pull.py wait --deployment-id "$DEPLOYMENT_ID"
