name: Release

on:
  release:
    types: [published]

# No release, package, or deployment writes in the verification job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      image: ${{ steps.source.outputs.image }}
    steps:
      - name: Check out event commit, not a moving branch or tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Verify signed tag, version, main ancestry, and successful source CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py verify --metadata "$RUNNER_TEMP/release.json"

  publish:
    name: Publish ARM64 release
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write # Attach assets to the existing release; do not create tags.
      actions: read
      packages: write
      id-token: write # GitHub-signed release provenance, not unsigned BuildKit claims.
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      IMAGE: ${{ needs.verify.outputs.image }}
    steps:
      - name: Check out the verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Recheck source before using write permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py verify --metadata "$RUNNER_TEMP/release.json"

      - name: Prepare isolated Docker runtime outside protected home directories
        run: sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /opt/gh-random-ci-docker

      - name: Enable local digest-addressable images for deployment rehearsals
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          runtime-basedir: /opt/gh-random-ci-docker
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the temporary Actions token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the versioned image with provenance and SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/${{ github.repository }}.git#${{ needs.verify.outputs.commit }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=MIT

      - name: Smoke-test the exact published digest before attaching deployment assets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          python .github/scripts/check_containers.py --image "$IMAGE@$DIGEST"

      - name: Sign the published image provenance with GitHub's OIDC identity
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify attached ARM64 source provenance and SBOM by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          python .github/scripts/install_oras.py --destination "$RUNNER_TEMP/oras-tools"
          python .github/scripts/verify_image_supply_chain.py --oras "$RUNNER_TEMP/oras-tools/oras" --image "$IMAGE@$DIGEST" --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/image-supply-chain.json"

      - name: Check tag again and package matching deployment files
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python .github/scripts/release.py verify --metadata "$RUNNER_TEMP/release.json"
          python .github/scripts/release.py bundle --metadata "$RUNNER_TEMP/release.json" --digest "$DIGEST" --output dist/release

      - name: Sign the exact deployment archive provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/release/*-deployment.tar.gz

      - name: Verify signed archive and image with the production identity policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deployment/attestations.py --metadata dist/release/release.json --archive "dist/release/gh-random-$RELEASE_TAG-deployment.tar.gz"

      - name: Attach digest, metadata, deployment archive, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY"

      - name: Record the immutable release reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Release `%s` passed container smoke tests.\n\nImage: `%s@%s`\n\nNo production deployment was started.\n' "$RELEASE_TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
