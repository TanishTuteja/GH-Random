name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check app tests alembic .github/scripts deployment

      - name: Lint Python
        run: .venv/bin/python -m ruff check app tests alembic .github/scripts deployment

      - name: Check types
        run: .venv/bin/python -m pyright

  tests:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: gh_random_ci_test
          POSTGRES_USER: gh_random_ci
          # Disposable credentials for this runner only; never production values.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gh_random_ci -d gh_random_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gh_random_ci:ci-only-password@127.0.0.1:5432/gh_random_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://gh_random_ci:ci-only-password@127.0.0.1:5432/gh_random_ci_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        env:
          GH_RANDOM_TEST_AGE: ${{ runner.temp }}/age-tools/age
        run: |
          .venv/bin/python deployment/install_age.py --destination "$RUNNER_TEMP/age-tools"
          .venv/bin/python -m pytest

      # Fixtures remove model tables after each test, leaving an empty database.
      - name: Apply migrations to empty database
        run: .venv/bin/python -m alembic upgrade head

      - name: Check for schema drift
        run: .venv/bin/python -m alembic check

  containers:
    name: Production containers
    # Match the provisioned OCI E2.1.Micro VM using a native AMD64 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Prepare isolated Docker runtime outside protected home directories
        run: sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /opt/gh-random-ci-docker

      - name: Enable local digest-addressable images for deployment rehearsals
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          runtime-basedir: /opt/gh-random-ci-docker
          daemon-config: |
            {"features": {"containerd-snapshotter": true}, "exec-opts": ["native.cgroupdriver=systemd"]}

      - name: Validate and smoke-test production containers
        run: python .github/scripts/check_containers.py

      - name: Rehearse concurrent discovery, crawl and backup within one GiB
        run: python .github/scripts/check_low_memory.py
