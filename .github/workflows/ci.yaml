name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check app tests alembic .github/scripts deployment

      - name: Lint Python
        run: .venv/bin/python -m ruff check app tests alembic .github/scripts deployment

      - name: Check types
        run: .venv/bin/python -m pyright

  tests:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gh_random_ci_test
          POSTGRES_USER: gh_random_ci
          # Disposable credentials for this runner only; never production values.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gh_random_ci -d gh_random_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gh_random_ci:ci-only-password@127.0.0.1:5432/gh_random_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://gh_random_ci:ci-only-password@127.0.0.1:5432/gh_random_ci_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: .venv/bin/python -m pytest

      # Fixtures remove model tables after each test, leaving an empty database.
      - name: Apply migrations to empty database
        run: .venv/bin/python -m alembic upgrade head

      - name: Check for schema drift
        run: .venv/bin/python -m alembic check

  containers:
    name: Production containers
    # Match the planned Oracle VM using a native, standard ARM64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Enable local digest-addressable images for deployment rehearsals
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Validate and smoke-test production containers
        run: python .github/scripts/check_containers.py
