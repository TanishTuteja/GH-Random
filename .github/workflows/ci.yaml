name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check app tests alembic

      - name: Lint Python
        run: .venv/bin/python -m ruff check app tests alembic

      - name: Check types
        run: .venv/bin/python -m pyright

  tests:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gh_random_ci_test
          POSTGRES_USER: gh_random_ci
          # Disposable credentials for this runner only; never production values.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gh_random_ci -d gh_random_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gh_random_ci:ci-only-password@127.0.0.1:5432/gh_random_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://gh_random_ci:ci-only-password@127.0.0.1:5432/gh_random_ci_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/python -m pytest

      # Fixtures remove model tables after each test, leaving an empty database.
      - name: Apply migrations to empty database
        run: .venv/bin/python -m alembic upgrade head

      - name: Check for schema drift
        run: .venv/bin/python -m alembic check
