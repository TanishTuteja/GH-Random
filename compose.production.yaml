name: gh-random

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *bounded-logging

x-app-service: &app-service
  <<: *app-hardening
  image: ${GH_RANDOM_IMAGE:?Set GH_RANDOM_IMAGE to the released image digest.}
  init: true
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24}
    cpus: ${DATABASE_CPUS:-1.0}
    mem_limit: ${DATABASE_MEMORY:-256m}
    # Conservative starting point for the 1 GB OCI micro host. These are
    # PostgreSQL settings, separate from the container's hard memory ceiling.
    command:
      - postgres
      - -c
      - max_connections=${DATABASE_MAX_CONNECTIONS:-32}
      - -c
      - shared_buffers=${DATABASE_SHARED_BUFFERS:-64MB}
      - -c
      - work_mem=${DATABASE_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${DATABASE_MAINTENANCE_WORK_MEM:-32MB}
      - -c
      - autovacuum_work_mem=${DATABASE_AUTOVACUUM_WORK_MEM:-16MB}
      - -c
      - max_parallel_workers=${DATABASE_MAX_PARALLEL_WORKERS:-0}
      - -c
      - jit=off
    pids_limit: 256
    logging: *bounded-logging
    env_file:
      - ${GH_RANDOM_POSTGRES_ENV_FILE:?Set GH_RANDOM_POSTGRES_ENV_FILE to an absolute path.}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    <<: *app-service
    cpus: ${MIGRATE_CPUS:-1.0}
    mem_limit: ${MIGRATE_MEMORY:-128m}
    pids_limit: 128
    profiles: ["migrate"]
    env_file:
      - ${GH_RANDOM_APP_ENV_FILE:?Set GH_RANDOM_APP_ENV_FILE to an absolute path.}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    networks:
      - backend

  web:
    <<: *app-service
    cpus: ${WEB_CPUS:-1.0}
    mem_limit: ${WEB_MEMORY:-128m}
    pids_limit: 128
    env_file:
      - ${GH_RANDOM_APP_ENV_FILE:?Set GH_RANDOM_APP_ENV_FILE to an absolute path.}
    restart: unless-stopped
    # All reachable peers are private, trusted application services; never
    # publish web's port or attach untrusted containers to proxy/backend.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${WEB_WORKERS:-1}", "--proxy-headers", "--forwarded-allow-ips", "*"]
    networks:
      - proxy
      - backend

  crawler:
    <<: *app-hardening
    image: ${GH_RANDOM_IMAGE:?Set GH_RANDOM_IMAGE to the released image digest.}
    init: true
    profiles: ["crawler"]
    env_file:
      - ${GH_RANDOM_CRAWLER_ENV_FILE:?Set GH_RANDOM_CRAWLER_ENV_FILE to an absolute path.}
    user: "0:0"
    cpus: ${CRAWLER_CPUS:-1.0}
    mem_limit: ${CRAWLER_MEMORY:-192m}
    pids_limit: 128
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:?Set GITHUB_APP_PRIVATE_KEY_HOST_PATH to an absolute path.}
        target: /run/secrets/github-app-private-key.pem
        read_only: true
    command: ["python", "-m", "app.cli", "crawl"]
    networks:
      - backend
      - crawler_egress

  caddy:
    <<: *app-hardening
    image: ${CADDY_IMAGE:-caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f}
    cap_add: [NET_BIND_SERVICE]
    cpus: ${CADDY_CPUS:-0.5}
    mem_limit: ${CADDY_MEMORY:-64m}
    pids_limit: 128
    env_file:
      - ${GH_RANDOM_CADDY_ENV_FILE:?Set GH_RANDOM_CADDY_ENV_FILE to an absolute path.}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - proxy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  proxy:
    internal: true
  backend:
    internal: true
  crawler_egress:
